<body class="passwordResetPage">
  <div id="cursor"><div id="cursorDot"></div><div id="cursorRing"></div></div>
  <div id="sharedNavigation"></div>
  <main class="passwordResetMain">
    <section class="passwordResetShell" aria-labelledby="passwordResetTitle">
      <div class="passwordResetSignal" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="passwordResetLogoWrap">
        <img src="assets/images/sos-logo.png" alt="Seeker Of SoundZ">
      </div>
      <p class="sectionEyebrow">Secure Account Recovery</p>
      <h1 id="passwordResetTitle">Create your new password</h1>
      <p class="passwordResetIntro">This secure page verifies the newest Supabase recovery link before allowing any password change.</p>

      <div class="passwordResetStatus" id="passwordResetStatus" data-state="loading">
        <span class="passwordResetSpinner" aria-hidden="true"></span>
        <span id="passwordResetStatusText">Verifying your password-reset link…</span>
      </div>

      <form id="dedicatedPasswordResetForm" class="passwordResetForm" hidden>
        <label>
          New password
          <div class="passwordFieldWrap">
            <input name="password" type="password" minlength="8" autocomplete="new-password" required>
            <button type="button" class="passwordReveal" data-reveal="password" aria-label="Show password">Show</button>
          </div>
        </label>
        <label>
          Confirm new password
          <div class="passwordFieldWrap">
            <input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
            <button type="button" class="passwordReveal" data-reveal="confirmPassword" aria-label="Show password">Show</button>
          </div>
        </label>
        <div class="passwordStrength" id="passwordStrength"><span></span></div>
        <p class="passwordResetHint">Use at least 8 characters. A longer unique password is recommended.</p>
        <button class="primaryButton passwordResetSubmit" type="submit">Update Password</button>
      </form>

      <div class="passwordResetActions">
        <a href="members.html" class="secondaryButton">Return to Members</a>
        <button type="button" class="secondaryButton" id="requestAnotherReset">Send a New Reset Email</button>
      </div>
      <p class="formMessage" id="passwordResetMessage" aria-live="polite"></p>
    </section>
  </main>
